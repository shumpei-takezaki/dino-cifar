[project]
name = "cifar-dino"
version = "0.1.0"
description = "Controlled DINO vs DINOv2 self-supervised pretraining on CIFAR-10 (ViT-Tiny/4)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.4",
    "torchvision>=0.19",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "wandb>=0.18",
]

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
    "pytest>=8.3",
    "scikit-learn>=1.9.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cifar_dino"]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }

[tool.pytest.ini_options]
testpaths = ["tests"]
